name: 'Security: Trivy Scan'

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '30 7 * * 1'

permissions: read-all

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-trivy-scan:
    name: 'Security: Trivy Vulnerability & Secret Scan'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # Scans for vulnerabilities (vuln) and secrets (secret) and config (config)
          scanners: 'vuln,secret,config'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload Trivy artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 5

      - name: Generate Trivy Summary
        if: always()
        run: |
          # Create a simple summary from the SARIF file if possible, or just a static message
          # Since parsing SARIF in bash is complex, we'll point to the Security tab
          echo "## 🛡️ Trivy Security Scan Results" > trivy_summary.md
          echo "" >> trivy_summary.md
          echo "Trivy scan completed. Results have been uploaded to the GitHub Security tab." >> trivy_summary.md
          echo "" >> trivy_summary.md
          echo "### Scanned Categories" >> trivy_summary.md
          echo "- ✅ Vulnerabilities (CRITICAL, HIGH)" >> trivy_summary.md
          echo "- ✅ Secrets / Credentials" >> trivy_summary.md
          echo "- ✅ Infrastructure Configuration" >> trivy_summary.md

          cat trivy_summary.md >> $GITHUB_STEP_SUMMARY

      - name: Update PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          retries: 3
          script: |
            const fs = require('fs');
            const updateComment = require('./.github/scripts/update-pr-comment.cjs');

            let body = 'Trivy scan completed. Check the Security tab for details.';
            if (fs.existsSync('trivy_summary.md')) {
              body = fs.readFileSync('trivy_summary.md', 'utf8');
              // Remove the header
              body = body.replace(/^## .*?\n/, '');
            }

            await updateComment({
              github,
              context,
              header: 'Trivy Security Scan',
              body,
              workflowYaml: 'security-trivy-scan.yml'
            });
